# Local override for running the Testing Toolkit against this project.
#
# Two changes from the upstream compose file:
#
# 1. Pull the published image instead of building `mojaloop/ml-testing-toolkit:local`
#    from source. The upstream file has `build: context: .`, which compiles the
#    whole Node project and takes many minutes; the released image is identical
#    for our purposes.
# 2. Mount our collections directory so the reconciliation test collection is
#    visible inside the container, and give the toolkit a route back to the host
#    so its callbacks can reach the backend on the host's port 8000.
#
# Start with:  docker compose up -d
# UI:          http://localhost:6060
# Toolkit API: http://localhost:5050
# Mock API:    http://localhost:4040

services:
  mojaloop-testing-toolkit:
    image: mojaloop/ml-testing-toolkit:v18.19.2
    build: !reset null
    # host.docker.internal lets callbacks from inside the container reach the
    # FastAPI backend running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "./spec_files:/opt/app/spec_files"
      - "./secrets:/opt/app/secrets"
      - "./examples:/opt/app/examples"

  mojaloop-testing-toolkit-ui:
    environment:
      - API_BASE_URL=http://localhost:5050
      - AUTH_ENABLED=FALSE
