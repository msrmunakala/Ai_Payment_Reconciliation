# Render Blueprint — Final branch
# Deploy both backend and frontend as separate Docker web services.
#
# Before deploying:
#   1. Set DATABASE_URL to your Neon pooled connection string
#   2. Set ANALYST_PASSWORD to a strong password
#   3. After backend deploys, copy its URL into VITE_API_URL for the frontend

services:
  # ── Backend (FastAPI + Neon PostgreSQL) ──────────────────────────────────
  - type: web
    name: ai-recon-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # paste your Neon pooled URL here in Render dashboard
      - key: API_KEY
        generateValue: true  # auto-generated strong key
      - key: ANALYST_USERNAME
        value: analyst
      - key: ANALYST_PASSWORD
        sync: false          # set a strong password in Render dashboard
      - key: SEED_ON_STARTUP
        value: "true"        # seeds demo data on first boot; set false after first deploy
      - key: CORS_ORIGINS
        sync: false          # set to your frontend Render URL after it deploys

  # ── Frontend (React + Vite + Nginx) ──────────────────────────────────────
  - type: web
    name: ai-payment-reconciliation
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: singapore
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false          # set to your backend Render URL e.g. https://ai-recon-backend.onrender.com
