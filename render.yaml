# Render Blueprint for the Final branch.
# Set DATABASE_URL to the Neon pooled connection string in Render dashboard.
services:
  - type: web
    name: ai-recon-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        generateValue: true
      - key: ANALYST_USERNAME
        value: analyst
      - key: ANALYST_PASSWORD
        sync: false
      - key: SEED_ON_STARTUP
        value: "false"

  - type: web
    name: ai-payment-reconciliation
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_API_URL
        sync: false
